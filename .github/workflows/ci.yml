name: CI

on:
  pull_request:
  push:
    branches: ["**"]

# CI only verifies code; it must never write back to repository branches.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile CashScript contracts
        run: npm run compile
      - name: Upload compiled BCH covenant artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-bch-covenants
          path: |
            contracts/AjoCircle.json
            contracts/AjoCirclePUSD.json
            contracts/AjoCircleV2.json
            contracts/AjoCircleV2Fee.json
          if-no-files-found: error
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build web app
        run: npm run build
