name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile CashScript contract
        run: npm run compile
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build web app
        run: npm run build
      - name: Commit regenerated contract artifact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/AjoCircle.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate CashScript artifact"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
      - name: Upload compiled contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-cashscript-artifact
          path: contracts/AjoCircle.json
