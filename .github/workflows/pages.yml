name: Test & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      # Frozen pre-hackathon demo for BLAZE judges (tag v0.1-pre-blaze) at /pre-blaze/
      - uses: actions/checkout@v4
        with:
          ref: v0.1-pre-blaze
          path: pre-blaze-src
      - name: Build pre-BLAZE snapshot
        run: |
          cd pre-blaze-src
          npm ci
          npm run compile
          npm run build
          cp -r dist ../dist/pre-blaze
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
