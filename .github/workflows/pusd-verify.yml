name: PUSD verification
on:
  push:
    branches: [pusd-circles-verify, pusd-circles]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npx cashc contracts/AjoCirclePUSD.cash -o contracts/AjoCirclePUSD.json
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
